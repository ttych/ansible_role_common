---

- ansible.builtin.include_tasks: _group.yml
  loop: "{{ _accounts_groups }}"
  loop_control:
    loop_var: _group


- ansible.builtin.include_tasks: _user.yml
  loop: "{{ _accounts_users }}"
  loop_control:
    loop_var: _user


- ansible.builtin.include_tasks: _dotfiles_user.yml
  loop: "{{ _accounts_users }}"
  loop_control:
    loop_var: _dotfiles_user
